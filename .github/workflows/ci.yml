name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # ≥22.6：build-skill.mjs 直接 import src/data/*.ts，依赖内置类型擦除
          node-version: 22.18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # build 内含数据一致性校验（validate-demos）、skill 产物生成、tsc、vite build 与 SEO 后处理
      - name: Build
        run: pnpm build

      # 改了 src/data 却忘了提交重建后的 skills/，在这里红
      - name: Skill 产物已同步
        run: git diff --exit-code -- skills
